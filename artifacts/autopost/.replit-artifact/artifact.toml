kind = "web"
previewPath = "/autopost/"
title = "AutoPost"
version = "1.0.0"
id = "artifacts/autopost"
router = "path"

[[services]]
name = "web"
paths = [ "/autopost/" ]
localPort = 23192

[services.development]
run = "pnpm --filter @workspace/autopost run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autopost", "run", "build" ]
serve = "static"
publicDir = "artifacts/autopost/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23192"
BASE_PATH = "/autopost/"
