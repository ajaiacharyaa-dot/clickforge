kind = "web"
previewPath = "/"
title = "ClickForge"
version = "1.0.0"
id = "artifacts/clickforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19097

[services.development]
run = "pnpm --filter @workspace/clickforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clickforge", "run", "build" ]
serve = "static"
publicDir = "artifacts/clickforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19097"
BASE_PATH = "/"
